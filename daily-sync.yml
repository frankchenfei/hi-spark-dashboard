name: Daily Auto-Sync
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Auto-commit data
        run: |
          git config user.name "hi-spark-bot"
          git config user.email "bot@hi-spark.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: sync $(date +'%Y-%m-%d')"
          git push